# 1. Fetch all products via GraphQL
query GetAllProducts {
  products {
    id
    name
    price
  }
}

# 2. Fetch product by ID
query GetProductByID {
  product(id: 1) {
    id
    name
    price
  }
}

# 3. Create Product
mutation CreateProduct {
  createProduct(name: "Mechanical Keyboard", price: 89.99) {
    id
    name
    price
  }
}

# 4. Create Order
mutation CreateOrder {
  createOrder(productId: 1, quantity: 2, total: 179.98) {
    id
    productId
    quantity
    total
  }
}

# 5. Fetch Order by ID
query GetOrderByID {
  order(id: 1) {
    id
    productId
    quantity
    total
  }
}

version: 0.2

phases:
  install:
    runtime-versions:
      golang: 1.25
    commands:
      - mkdir -p /tmp/go-cache
      - go version
  pre_build:
    commands:
      - export GOCACHE=/tmp/go-cache
      - cd ecommerce-management-system
      - go mod download
      - echo "Running concurrency race tests..."
      - go test -v -race ./services/order/tests/...
  build:
    commands:
      - export GOCACHE=/tmp/go-cache
      - echo "Building all microservices..."
      - GOOS=linux GOARCH=amd64 go build -o gateway_bin ./gateway
      - GOOS=linux GOARCH=amd64 go build -o auth_bin ./services/auth
      - GOOS=linux GOARCH=amd64 go build -o product_bin ./services/product
      - GOOS=linux GOARCH=amd64 go build -o order_bin ./services/order
artifacts:
  base-directory: ecommerce-management-system
  files:
    - gateway_bin
    - auth_bin
    - product_bin
    - order_bin
    - Procfile